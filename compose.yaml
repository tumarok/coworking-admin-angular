# The whole app on one machine: the mock API and the app behind nginx.
#   docker compose up --build       then open http://localhost:8080
# Sign in with admin@coworking.test / demo1234. The API is reachable only through the web
# container (/api is proxied), so its port is not published.
name: coworking-admin-angular

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ghcr.io/${GHCR_OWNER:-tumarok}/coworking-admin-angular-api:latest
    environment:
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-150}
    healthcheck:
      # The mock answers 401 to a request without a token, which is as good as up.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4010/api/v1/auth/me').then((r) => process.exit(Number(r.status !== 401)), () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ghcr.io/${GHCR_OWNER:-tumarok}/coworking-admin-angular:latest
    environment:
      API_UPSTREAM: http://api:4010
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
