<app-page-header title="Members" subtitle="People and teams with a plan">
  <button mat-flat-button type="button" (click)="create()">
    <app-icon name="add" size="1.125rem" />
    New member
  </button>
</app-page-header>

<app-list-toolbar
  label="Filter members"
  [filtersActive]="store.hasActiveFilters()"
  (clearClick)="store.reset()"
>
  <app-search-input
    label="Search name, email or company"
    [value]="store.params().q"
    (searchChange)="store.setSearch($event)"
  />
  <app-filter-select
    label="Plan"
    anyLabel="Any plan"
    [options]="planOptions"
    [value]="store.params().plan"
    (valueChange)="store.setFilter('plan', $event)"
  />
  <app-filter-select
    label="Status"
    anyLabel="Any status"
    [options]="statusOptions"
    [value]="store.params().status"
    (valueChange)="store.setFilter('status', $event)"
  />
</app-list-toolbar>

<app-data-table
  caption="Members"
  [columns]="columns"
  [rows]="members.value()?.items"
  [total]="members.value()?.total ?? 0"
  [page]="store.params().page"
  [limit]="store.params().limit"
  [fetching]="members.isFetching()"
  [error]="members.error()?.message"
  [emptyMessage]="emptyMessage()"
  (pageChange)="store.paginate($event)"
  (retry)="members.refresh()"
>
  <ng-template appCell="status" let-row><app-status-chip [status]="row.status" /></ng-template>
</app-data-table>
