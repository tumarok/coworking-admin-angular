<a class="skip-link" href="#main" (click)="skipToPage($event)">Skip to main content</a>

<header>
  <mat-toolbar>
    @if (narrow()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Open navigation"
        aria-controls="navigation"
        [attr.aria-expanded]="drawerOpen()"
        (click)="drawerOpen.set(true)"
      >
        <app-icon name="menu" />
      </button>
    }
    <a class="brand" routerLink="/">{{ appName }}</a>
    <span class="spacer"></span>
    <app-user-menu />
  </mat-toolbar>
  @if (navigating()) {
    <mat-progress-bar class="loading" mode="indeterminate" aria-label="Loading page" />
  }
</header>

<mat-sidenav-container>
  <mat-sidenav
    id="navigation"
    [mode]="narrow() ? 'over' : 'side'"
    [opened]="!narrow() || drawerOpen()"
    (closedStart)="drawerOpen.set(false)"
  >
    <nav aria-label="Main">
      <ul>
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="nav-link"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLink]="item.path"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              (click)="closeDrawer()"
            >
              <app-icon [name]="item.icon" />
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="main" #page tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
