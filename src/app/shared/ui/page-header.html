@if (back(); as back) {
  <a class="back" [routerLink]="back.link">
    <app-icon name="arrow_back" size="1.125rem" />
    {{ back.label }}
  </a>
}
<div class="row">
  <div class="titles">
    <h1>{{ title() }}</h1>
    @if (subtitle(); as subtitle) {
      <p class="subtitle">{{ subtitle }}</p>
    }
  </div>
  <div class="actions">
    <ng-content />
  </div>
</div>
